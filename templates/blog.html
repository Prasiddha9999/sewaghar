{% extends 'hedfot.html'%}
{% block content %}
{% load static %}

    <!-- About Sewa Ghar-->
    <section class="main_heading my-5">
      <div class="text-center container">
        <h2 class="display-5"><b>Blog</b></h2>
        <hr class="w-25 mx-auto"/>
      </div>

{%for i in blog%}
      <div class="container">
        <div class="row">
          <div class="col-lg-6 col-md-6 col-12 col-xxl-6">  
            <figure>
              <img src="/media/{{i.photo}}" alt="About Us IMG" width="600" height="280" >
 



            </figure>
          </div>

          <div class="col-lg-6 col-md-6 col-12 col-xxl-6 d-flex justify-content-center align-items-start flex-column">
            <h1>{{i.title}}</h1>
            <p>
             {{i.desc}}
            </p>
          </div>
        </div>
      </div>
      
{%endfor%}


    </section>
    {% endblock %}
