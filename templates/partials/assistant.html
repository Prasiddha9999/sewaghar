<div id="sg-assistant">
  <div id="sg-assistant-panel" role="dialog" aria-label="SewaGhar help assistant">
    <div class="sg-assistant-head"><i class="bi bi-stars"></i>SewaGhar Sahayogi<span class="ms-auto small fw-normal">AI help</span></div>
    <div id="sg-assistant-body"></div>
    <form id="sg-assistant-form" autocomplete="off">
      <input type="text" id="sg-assistant-input" class="form-control" placeholder="Ask about booking, accounts, payments..." maxlength="500">
      <button type="submit" class="btn btn-primary" aria-label="Send"><i class="bi bi-send"></i></button>
    </form>
  </div>
  <button id="sg-assistant-fab" type="button" aria-label="Open help assistant"><i class="bi bi-chat-dots"></i></button>
</div>
