
<html>
  <head>
    <script src="https://khalti.s3.ap-south-1.amazonaws.com/KPG/dist/2020.12.17.0.0.0/khalti-checkout.iffe.js"></script>
  </head>
  <body>
    {% csrf_token %}
    <script>
        let orderid = "{{orderid}}";
        const paymentpass = (payload) => {
            
           // console.log("I am Working !!");
            const csrf_token = document.getElementsByName('csrfmiddlewaretoken')[0].value;
            fetch("{% url 'verify' %}", {
                method: "POST",
  
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrf_token,
                },
                
                body: JSON.stringify(payload),
            })
            .then((response) => response.json())
            .then((data) => {
                console.log("Success:", data);
            })
            .catch((error) => {
                console.error("Error:", error);
            });
        }
      
              const config = {
                  // replace the publicKey with yours
                  "publicKey": "test_public_key_eb79320089ec458c81a9346c77028152",
                  "productIdentity": orderid,
                  "productName": "SewaGhar",
                  "productUrl": "http://sewagharservice.com",
                  "paymentPreference": [
                      "KHALTI",
                      "EBANKING",
                      "MOBILE_BANKING",
                      "CONNECT_IPS",
                      "SCT",
                      ],

                  "eventHandler": {
                      onSuccess (payload) {
                          // hit merchant api for initiating verfication
                          //console.log(payload);
                          paymentpass(payload);
                          window.location.replace(`/bookingdetails/{{orderid}}`);
                        
                      },
                      onError (error) {
                          console.log(error);
                          window.location.replace(`/bookingdetails/{{orderid}}`);
                          
                      },
                      onClose () {
                          console.log('widget is closing');
                          window.location.replace(`/bookingdetails/{{orderid}}`);
                         
                      }
                  }
              };

              const checkout = new KhaltiCheckout(config);
              checkout.show({amount: {{amount}}*100});
    </script>

    {% include 'homeowners/paymentpage.html'%}
  </body>
</html>
