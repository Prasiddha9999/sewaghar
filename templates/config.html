{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalti Payment — SewaGhar</title>
    <link rel="icon" href="{% static 'images/logo.png' %}">
    <script>
      (function () {
        var theme = 'light';
        try { theme = localStorage.getItem('sg-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/sewaghar.css' %}">
    <script src="https://khalti.s3.ap-south-1.amazonaws.com/KPG/dist/2020.12.17.0.0.0/khalti-checkout.iffe.js"></script>
    <style>body { padding-top: 0; }</style>
</head>
<body>
  {% csrf_token %}

  <main class="sg-main d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 1.5rem;">
    <div class="card sg-card text-center" style="max-width: 460px; width: 100%; padding: 2.5rem 2rem;">
      <div class="mx-auto mb-3" style="width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: var(--sg-primary-soft); color: var(--sg-primary); font-size: 1.8rem;">
        <i class="bi bi-wallet2"></i>
      </div>
      <h3>Khalti Payment</h3>
      <p class="sg-muted mb-1">Order #{{ orderid }} · Rs. {{ amount }}</p>
      <p class="sg-muted">The Khalti checkout window is opening.<br>Complete your payment there — you'll be redirected back automatically.</p>
      <a href="/bookingdetails/{{ orderid }}" class="btn btn-outline-primary mt-2"><i class="bi bi-arrow-left me-2"></i>Back to Booking</a>
    </div>
  </main>

  <script>
      let orderid = "{{ orderid }}";
      const paymentpass = (payload) => {
          const csrf_token = document.getElementsByName('csrfmiddlewaretoken')[0].value;
          fetch("{% url 'verify' %}", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json",
                  "X-CSRFToken": csrf_token,
              },
              body: JSON.stringify(payload),
          })
          .then((response) => response.json())
          .then((data) => {
              console.log("Success:", data);
          })
          .catch((error) => {
              console.error("Error:", error);
          });
      }

      const config = {
          // replace the publicKey with yours
          "publicKey": "test_public_key_eb79320089ec458c81a9346c77028152",
          "productIdentity": orderid,
          "productName": "SewaGhar",
          "productUrl": "http://sewagharservice.com",
          "paymentPreference": [
              "KHALTI",
              "EBANKING",
              "MOBILE_BANKING",
              "CONNECT_IPS",
              "SCT",
              ],
          "eventHandler": {
              onSuccess (payload) {
                  // hit merchant api for initiating verification
                  paymentpass(payload);
                  window.location.replace(`/bookingdetails/{{orderid}}`);
                  setTimeout(function() {
                    window.location.reload();
                  }, 1000);
              },
              onError (error) {
                  console.log(error);
                  window.location.replace(`/paymentpage`);
              },
              onClose () {
                console.log('widget is closing');
                window.location.replace(`/bookingdetails/{{orderid}}`);
                setTimeout(function() {
                  window.location.reload();
                }, 1000);
              }
          }
      };

      const checkout = new KhaltiCheckout(config);
      checkout.show({amount: {{amount}}*100});
  </script>
</body>
</html>
