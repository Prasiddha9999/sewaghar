{% extends 'professionals/pbases.html'%}
{% block content %}
{% load static %}
    <!-- Middle Section -->
    <br><br>
    <div class="text-center my-5">
      <h3 class="display-5">My Profile</h3>
      <hr class="w-25 mx-auto">
    </div>
    <br>
    
    <div class="container">
      <div class="row">
        <div class="col-lg-5 col-md-5 col-12 col-xxl-5 d-flex flex-column">
            <div class="professionals_image">
                <img src="/media/{{po.photo}}" class="col-8 rounded float-start" alt="Professioanal Image">
            </div>
        </div>
        <div class="col-lg-7 col-md-7 col-12 col-xxl-7">
            <div class="Professional_details">
              <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-outline mb-4">
                  <label class="form-label" for="username">Username</label>
                  <input type="text" id="username" class="form-control" name="username" value="{{po.username}}" required/>
                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" name="full_name" value="{{po.full_name}}" required/>
                    </div>

                  <div class="form-outline mb-4">
                  <label class="form-label" for="homeemail">Email</label>
                  <input type="email" id="homeemail" class="form-control" name="email" value="{{po.email}}" required/>
                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="number">Contact Number</label>
                    <input type="text" id="number" class="form-control" name="number" value="{{po.number}}" required/>
                    </div>

                    <div class="form-outline mb-4">
                      <label class="form-label" for="address">Address</label>
                      <input type="text" id="name" class="form-control" name="address" value="{{po.address}}" required/>
                      </div>

                      <div class="form-outline mb-4">
                        <label class="form-label" for="age">Age</label>
                        <input type="number" id="age" class="form-control" name="age" value="{{po.age}}" required/>
                        </div>

                        <div class="form-outline mb-4">
                          <label for="gender" class="form-label">Gender</label>
                          <select class="form-select" id="gender" name="gender" value="{{po.gender}}" required>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Others</option>
                          </select>
                        </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="exprience">No of Expriences</label>
                    <input type="number" id="exprience" class="form-control" name="exprience" value="{{po.exprience}}" required/>
                    </div>

                    <div class="mb-3">
                      <label for="photo" class="form-label">Attached Your Photo</label>
                      <input class="form-control" name="photo" type="file" id="photo" accept="image/*">
                    </div>
    

                    <div>
                        <label>Description</label>
                        <textarea id="name" class="form-control" name="desc" required>{{po.desc}}</textarea>

                    </div>
                     <!-- if some error dispaly message here-->
              <div class="errormsg">
                {% for message in messages%}
                <h5>{{message}}</h5>
                {% endfor%}
              </div>

              <div class="text-center pt-1 mb-5 pb-1">
                <button class="btn btn-outline-success" type="Submit">Save</button><br>
              </div>

                </form>
            </div>
        </div>
        <br><br>
    </div>
</div>
{% endblock %}
