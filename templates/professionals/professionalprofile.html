{% extends 'professionals/pbases.html'%}
{% block content %}
{% load static %}
    <!-- Middle Section -->
    <br><br>
    <div class="text-center my-5">
      <h3 class="display-5">My Profile</h3>
      <hr class="w-25 mx-auto">
    </div>
    <br>
    
    <div class="container">
      <div class="row">
        <div class="col-lg-5 col-md-5 col-12 col-xxl-5 d-flex flex-column">
            <div class="professionals_image">
                <img src="{% static 'images/professionals.jpg'%}" class="col-8 rounded float-start" alt="Professioanal Image">
            </div>
        </div>
        <div class="col-lg-7 col-md-7 col-12 col-xxl-7">
            <div class="Professional_details">
                <form>
                  <div class="form-outline mb-4">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Ram Sharma" required/>
                    </div>

                  <div class="form-outline mb-4">
                  <label class="form-label" for="homeemail">Email</label>
                  <input type="email" id="homeemail" class="form-control" placeholder="ram@gmail.com" required/>
                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="number">Contact Number</label>
                    <input type="text" id="number" class="form-control" placeholder="9863144095" required/>
                    </div>

                    <div class="form-outline mb-4">
                      <label class="form-label" for="address">Address</label>
                      <input type="text" id="name" class="form-control" placeholder="Kharibot" required/>
                      </div>

                      <div class="form-outline mb-4">
                        <label class="form-label" for="age">Age</label>
                        <input type="number" id="age" class="form-control" placeholder="25" required/>
                        </div>

                        <div class="form-outline mb-4">
                          <label for="gender" class="form-label">Gender</label>
                          <select class="form-select" id="gender" required>
                            <option selected disabled value="">Male</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Others</option>
                          </select>
                        </div>

                        <div class="form-outline mb-4">
                          <label for="service" class="form-label">Service</label>
                          <select class="form-select" id="service" required>
                            <option selected disabled value="">1</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                          </select>
                        </div>

                        <div class="form-outline mb-4">
                          <label for="subservice" class="form-label">Sub-Service</label>
                          <select class="form-select" id="subservice" aria-describedby="subservice" required>
                            <option selected disabled value="">2</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                          </select>
                          <div id="subservice" class="invalid-feedback">
                            Please select Service First
                          </div>
                        </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="exprience">No of Expriences</label>
                    <input type="number" id="exprience" class="form-control" placeholder="3" required/>
                    </div>

                  <div class="mb-3">
                    <label for="photo" class="form-label">Attached Your Photo here to update</label>
                    <input class="form-control" type="file" id="photo" >
                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="homepassword">Password</label>
                    <input type="password" id="homepassword" class="form-control" placeholder="ram@1234" required/>
                    </div>

                    <div>
                        <label>Description</label>
                        <textarea class="form-control" placeholder="I am a Carpenter with 5 year of exprience in US." id="exampleFormControlTextarea1" rows="1"></textarea>
                    </div>


                </form>
            </div>
        </div>
        <div class="editbtn text-end">
            <br>
            <button type="button" class="btn btn-success">Save</button>
          </div>
        <br><br>
    </div>
</div>
{% endblock %}
