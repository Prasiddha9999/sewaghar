{% extends 'hedfot.html'%}
{% block content %}
{% load static %}
    <!-- signup -->
        <div class="container-fluid">
            <div class="row login">
              <div class="col-lg-6 col-md-6 col-12 col-xxl-6 shadow-lg p-3 mb-5 bg-body rounded">
                <div class="text-center">
                    <br><br><br><br>
                    <h3 class="pt-10 mb-5 pb-1">Login for Professionals</h3>
                  </div>
  
                  <form  action="psignin" method="post">
                    {% csrf_token %}
                    <div class="form-outline mb-4">
                      <label class="form-label" for="username">Username</label>
                      <input type="text" id="username" name = "username" class="form-control" placeholder="Enter the Unique Username " required/>
                      </div>
  
                    <div class="form-outline mb-4">
                    <label class="form-label" for="password">Password</label> 
                    <div class="input-group">
                    <input type="password" id="homepassword" name = "password" class="form-control" placeholder="Enter your Password" required/>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()"><i id="password-icon" class="bi bi-eye-slash"></i></button>
                    </div>
                    </div>

                   
  
                     <!-- if user gives wrong data dispaly here -->
                     <div class="errormsg">
                      {% for message in messages%}
                      <h5>{{message}}</h5>
                      {% endfor%}
                  </div>

                    <div class="text-center pt-1 mb-5 pb-1">
                      <button class="btn btn-outline-danger my-5" type="Submit">Login</button><br>
                      <a class="text-muted" href="{% url 'pforgetpassword' %}">Forgot password?</a>
                    </div>
                  </form>
              </div>
    
              <div class="col-lg-6 col-md-6 col-12 col-xxl-6 text-center shadow p-3 mb-5 rounded" style="background-color: #f07147d2">
                <br><br><br><br><br><br><br><br>
                <h3 class="mb-4">New Here?</h3><br>
                <p class="medium mb-0">Sign up and get new exprience on Sewa ghar.</p><br>
                <button type="button" class="btn btn-outline-secondary my-5 signup"><a href="{% url 'psignup' %}"style="text-decoration: none; color: black;">SignUp</a></button>
              </div>
            </div>  
          </div>
                      
         <!-- footer -->
         {% endblock %}
