{% extends 'hedfot.html' %}
{% block title %}Reset Password — SewaGhar{% endblock %}
{% block content %}
{% load static %}

<div class="sg-auth-wrap">
  <div class="sg-auth sg-auth-single">
    <div class="sg-auth-form">
      <div class="text-center mb-2">
        <span class="sg-eyebrow"><i class="bi bi-shield-lock"></i> Almost done</span>
      </div>
      <h3 class="text-center">Set a new password</h3>
      <p class="sg-auth-sub text-center">Choose a strong password you haven't used before.</p>

      <form action="{% url 'ppassword_reset' %}" method="post">
        {% csrf_token %}
        <div class="sg-field">
          <label class="form-label" for="newpassword">New Password</label>
          <div class="input-group">
            <input type="password" id="newpassword" name="newpassword" class="form-control" placeholder="Enter the new password" required>
            <button class="btn btn-outline-secondary sg-pass-toggle" type="button" data-target="newpassword" aria-label="Show password"><i class="bi bi-eye-slash"></i></button>
          </div>
        </div>

        <div class="sg-field">
          <label class="form-label" for="conformnewpassword">Confirm Password</label>
          <div class="input-group">
            <input type="password" id="conformnewpassword" name="conformnewpassword" class="form-control" placeholder="Repeat the new password" required>
            <button class="btn btn-outline-secondary sg-pass-toggle" type="button" data-target="conformnewpassword" aria-label="Show password"><i class="bi bi-eye-slash"></i></button>
          </div>
        </div>

        <div class="errormsg">
          {% for message in messages %}
          <h5>{{ message }}</h5>
          {% endfor %}
        </div>

        <div class="d-grid gap-2 mt-4">
          <button class="btn btn-primary sg-btn-lg" type="submit"><i class="bi bi-check2-circle me-2"></i>Save New Password</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
