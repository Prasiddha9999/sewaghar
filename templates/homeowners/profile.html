{% extends 'homeowners/hbases.html'%}
{% block content %}
{% load static %}
    <!-- Middle Section -->
    <br><br>
    <div class="text-center my-5">
      <h3 class="display-5">My Profile</h3>
      <hr class="w-25 mx-auto">
    </div>
    <br>
    
    <div class="container">
      <div class="row">
        <div class="col-lg-5 col-md-5 col-12 col-xxl-5 d-flex flex-column">
            <div class="professionals_image">
                <img src="{% static 'images/prof.png'%}" class="col-8 rounded float-start" alt="Professioanal Image">
            </div>
        </div>
        <div class="col-lg-7 col-md-7 col-12 col-xxl-7">
            <div class="Homeowner_details">
              <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-outline mb-4">
                  <label class="form-label" for="name">Full Name</label>
                  <input type="text" id="name" name = "full_name" class="form-control" placeholder="{{user.username.full_name}}" required/>
                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="homeemail">Username</label>
                    <input type="text" id="username" name = "username" class="form-control" placeholder="{{user.username}}" required/>
                    </div>


                <div class="form-outline mb-4">
                <label class="form-label" for="homeemail">Email</label>
                <input type="email" id="homeemail" name = "email" class="form-control" placeholder="{{user.email}}" required/>
                </div>

                <div class="form-outline mb-4">
                  <label class="form-label" for="number">Contact Number</label>
                  <input type="text" id="number" name = "number" class="form-control" placeholder="{{user.number}}" required/>
                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label" for="address">Address</label>
                    <input type="text" id="name" name = "address" class="form-control" placeholder="{{user.address}}" required/>
                    </div>

                <div class="form-outline mb-4">
                <label class="form-label" for="homepassword1">Password</label>
                <input type="password" id="password" name = "password" class="form-control" placeholder="*******" required/>
                </div>

                <div class="mb-3">
                  <label for="photo" class="form-label">Attached Your Photo</label>
                  <input class="form-control"  name = "photo" type="file" id="photo" >
                </div>
                
                <!-- if some error dispaly message here-->
                <div class="errormsg">
                  {% for message in messages%}
                  <h5>{{message}}</h5>
                  {% endfor%}
                </div>

                <div class="text-center pt-1 mb-5 pb-1">
                  <button class="btn btn-outline-success" type="Submit">Save</button><br>
                </div>

              </form>
          </div>
        </div>
        <br><br>
    </div>
</div>

{% endblock %}
