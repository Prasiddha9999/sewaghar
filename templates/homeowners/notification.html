{% extends 'homeowners/hbases.html'%}
{% block content %}
{% load static %}

    <!-- Middle Section -->
    <br><br>
    <div class="text-center my-5">
      <h3 class="display-5"><b>Notifications</b></h3>
      <hr class="w-25 mx-auto"/>
    </div>
  
    
    <div class="container mt-3">
      <div class="table-responsive" style="max-height: 300px; overflow-y: scroll;">
        <table class="table border table-light table-hover">
          <tbody>
            {% for i in msg %}
            <tr {% if i.view is True %}style="color: #392C42B2;"{% endif %} onclick="submitForm('{{ i.not_id }}')">
              <th scope="row">{{ i.notification }}</th>
              <td style="text-align: right;">{{ i.time }}</td>
            </tr>
            <form id="form_{{ i.not_id }}" method="post" action="{% url 'update_notification_view' %}">
              {% csrf_token %}
              <input type="hidden" name="not_id" value="{{ i.not_id }}">
            </form>
          {% endfor %}
          
          <script>
            function submitForm(notId) {
              document.getElementById("form_" + notId).submit();
            }
          </script>
        
          </tbody>
        </table>
      </div>
    </div>
    
  <br>
  <hr>
  <br>
  {% include 'homeowners/comment.html' %} 
{% endblock %}
