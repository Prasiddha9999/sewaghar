{% extends 'homeowners/hbases.html'%}
{% block content %}
{% load static %}

    <!-- Middle Section -->
    <br><br>
    <div class="text-center my-5">
      <h3 class="display-5"><b>Notifications</b></h3>
      <hr class="w-25 mx-auto"/>
    </div>
  
    
    <div class="container mt-3">
      <div class="table-responsive" style="max-height: 300px; overflow-y: scroll;">
        <table class="table border table-light table-hover">
          <tbody>

            {% for i in msg %}
                <tr>
                    <th scope="row">{{ i.notification }}</th>
                    <td style="text-align: right;">
                      {{i.time}}
                    </td>
                </tr>
            {% endfor %}
            
        
        
        
        
        
          
        
          
        
          
        
          </tbody>
        </table>
      </div>
    </div>
    
  <br>
  <hr>
  <br>
  {% include 'homeowners/comment.html' %} 
{% endblock %}
