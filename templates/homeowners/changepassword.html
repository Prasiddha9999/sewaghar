{% extends 'homeowners/hbases.html'%}
{% block content %}
{% load static %}
    <!-- Middle Section -->
    <br><br>
    <div class="text-center my-5">
      <h3 class="display-5"><b>Change Password</b></h3>
      <hr class="w-25 mx-auto">
    </div>
    <br>
    
    <div class="container">
      <div class="row">
        <div class="col-lg-5 col-md-5 col-12 col-xxl-5 d-flex flex-column">
            <div class="professionals_image">
                <img src="/media/{{hprofile.photo}}" width="250" height="300"class="col-8 rounded float-start" alt="Professioanal Image">
            </div>
        </div>
        <div class="col-lg-7 col-md-7 col-12 col-xxl-7">
          <div class="Homeowner_details">
            <br>
            <h5>Name:  {{hprofile.full_name}}</h5>
            <h5>Email:  {{hprofile.email}}</h5> 
            <h5>Username:  {{hprofile.username}}</h5>
            <br>
        </div>
            <div class="Homeowner_password">
              <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-outline mb-4">
                    <label class="form-label" for="password">New Password</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password" class="form-control" value="" placeholder="Enter the new password to change" required />
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                                <i id="password-icon" class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                </div>
                <div class="form-outline mb-4">
                  <label class="form-label" for="conformpassword">Confirm New Password</label>
                      <div class="input-group">
                          <input type="password" id="conformpassword" name="conformpassword" class="form-control" value="" placeholder="Enter the new conform password to change" required />
                          <button class="btn btn-outline-secondary" type="button" onclick="togglePassword1()">
                              <i id="password-icon" class="bi bi-eye-slash"></i>
                          </button>
                      </div>
              </div>
              <!-- if some error dispaly message here-->
              <div class="errormsg">
                {% for message in messages%}
                <h5>{{message}}</h5>
                {% endfor%}
              </div>

              <div class="text-center pt-1 mb-5 pb-1">
                <button class="btn btn-outline-success" type="Submit">Save</button><br>
              </div>

            </form>
            
          </div>
        </div>
        <br><br>
    </div>
</div>

{% endblock %}
