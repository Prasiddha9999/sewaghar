
{% extends 'homeowners/hbases.html'%}
{% block content %}
{% load static %}
    <!-- Middle Section -->
    <br><br>
    <div class="text-center my-5">
      <h3 class="display-5"><b>Service: <u>{{sk.service}} - {{sk.subservice}}</b></u></h3>
      <hr class="w-25 mx-auto"/>
    </div>
    <br>
    
    <div class="container">
      <div class="row">
        <div class="col-lg-6 col-md-6 col-12 col-xxl-6 d-flex flex-column">
          <div class="card h-100">
            <div class="card-body text-center text-decoration-none d-flex flex-column justify-content-between">
              <h3>{{sk.service}} : {{sk.subservice}}</h3>
              <figure><img src="/media/{{servicedata.photo}}"  style="max-width:50%; height:auto;" class="img-fluid" alt="Service Image"></figure>
              <h5 class="card-title"><span style="color: #808080">{{ servicedata.desc }}</span></h5>
            </div>
          </div>
          <div class="nextprevious">
            <a href="{{request.META.HTTP_REFERER}}" class="btn btn-danger back" role="button">Back</a>
          </div>
        </div>

        <div class="col-lg-6 col-md-6 col-12 col-xxl-6">
      <form action="{% url 'servicetime' s%}" method="post">
          {% csrf_token %}

          <label for="Date">Date</label>
          <input id="date-picker" type="date"  name="date" class="form-control" autocomplete="off" required/>
          <br>
          <label for="Time">Time</label>
          <input id="Time" name="time" type="time" class="form-control" required/>
          <br>
          <label for="Location">Location</label>
          <input id="Location" name="address" type="text" class="form-control" required/>
          <br>
          <label for="Contact Number">Contact Number</label>
          <input id="number" name="number" type="number" minlength="10"   class="form-control" required/>
          <br>
          <label for="HouseNumber">Your House Number Optional</label>
          <input id="HouseNumber" name="houseno"  type="text" class="form-control" />
          <br>
          
          <td><a href="https://www.google.com/maps/" target="_blank" ><img class="gmaplogo" src="{% static 'images/gmap.png' %}" target="blank" alt="Google Maps Logo" width="90" height="50"></a></td><label for="Gmap">Click the side logo to Open Google Map</label><br><Br>
          <label for="Gmap">Copy the Link of your House form Google Map</label>
          <input id="gmap" name="gmap"  type="text" class="form-control" required/>
          <br>
    
          <div class="errormsg">
            <h5>{{error_message}}</h5>
          </div>


          <div class="nextprevious">
            <button type="submit"  class="btn btn-success next">Book</button>
          </div>

        <script>
          //date picker for apppointment
          const datePicker = document.getElementById("date-picker");

          datePicker.min = getDate();
          datePicker.max = getDate(15);
          
          // Borrowed from https://stackoverflow.com/a/29774197/7290573
          function getDate(days) {
              let date;
          
              if (days !== undefined) {
                  date = new Date(Date.now() + days * 24 * 60 * 60 * 1000);
              } else {
                  date = new Date();
              }
          
              const offset = date.getTimezoneOffset();
          
              date = new Date(date.getTime() - (offset*60*1000));
          
              return date.toISOString().split("T")[0];
          }
        </script>

        </div>
      </form>
      </div>
    </div>
  <br>
  <hr>
  <br>
  {% include 'homeowners/comment.html' %} 

  {% endblock %}
