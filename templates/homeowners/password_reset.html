{% extends 'hedfot.html'%}
{% block content %}
{% load static %}


      <!-- signup -->
        <!-- signip -->
        <div class="container-fluid">
          <div class="row login">
            <div class="col-lg-12 col-md-12 col-12 col-xxl-12 shadow-lg mb-2 bg-body rounded">
              <div class="text-center">
                  <br><br><br><br>
                  <h3 class="pt-10 mb-5 pb-1"><u>Enter Otp for recover Forget Password</u></h3>
                </div>

                <form  action="password_reset" method="post">
                  {% csrf_token %}
                  <div class="form-outline mb-4">
                    <label class="form-label" for="homepassword1">New Password</label>
                    <div class="input-group">
                    <input type="password" id="homepassword" name = "newpassword" class="form-control" placeholder="Enter the New Password" required/>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()"><i id="password-icon" class="bi bi-eye-slash"></i></button>
                    </div>

                    <label class="form-label" for="homepassword2">Conform Password</label>
                    <div class="input-group">
                    <input type="password" id="homepassword1" name = "conformnewpassword" class="form-control" placeholder="Enter the conform Password" required/>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword1()"><i id="password-icon" class="bi bi-eye-slash"></i></button>
                    </div>
                  </div>

                 <!-- if user gives wrong data dispaly here -->
                  <div class="errormsg">
                    {% for message in messages%}
                    <h5>{{message}}</h5>
                    {% endfor%}
                </div>

                  <div class="text-center pt-1 mb-5 pb-1">
                    <button class="btn btn-outline-success my-5" type="submit">Save</button><br>
                  </div>
                </form>
              </div>
            </div>
          </div>
     

                      
          {% endblock %}
