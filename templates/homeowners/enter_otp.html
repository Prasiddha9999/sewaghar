{% extends 'hedfot.html'%}
{% block content %}
{% load static %}


      <!-- signup -->
        <!-- signip -->
        <div class="container-fluid">
          <div class="row login">
            <div class="col-lg-12 col-md-12 col-12 col-xxl-12 shadow-lg mb-2 bg-body rounded">
              <div class="text-center">
                  <br><br><br><br>
                  <h3 class="pt-10 mb-5 pb-1"><u>Enter Otp for recover Forget Password</u></h3>
                </div>

                <form  action="enter_otp" method="post">
                  {% csrf_token %}
                  <div class="form-outline mb-4">
                  <label class="form-label" for="otp">Username</label>
                  <input type="text" id="otp" name = "otp" class="form-control" placeholder="Enter the OTP code here" required/>
                  </div>

                 <!-- if user gives wrong data dispaly here -->
                  <div class="errormsg">
                    {% for message in messages%}
                    <h5>{{message}}</h5>
                    {% endfor%}
                </div>

                  <div class="text-center pt-1 mb-5 pb-1">
                    <button class="btn btn-outline-success my-5" type="submit">Submit OTP</button><br>
                  </div>
                </form>
              </div>
            </div>
          </div>
     

                      
          {% endblock %}
