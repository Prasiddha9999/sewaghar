{% extends 'admin/bases.html'%}
{% block content %}
{% load static %}
<!--Main layout-->
<main>
    <!-- Middle Section -->
    <br>
    <div class="text-center my-5">
      <h3 class="display-5">Service Detail</h3>
      <hr class="w-25 mx-auto">
    </div>
 
    <div class="container">
      <div class="col-lg-12 col-md-12 col-12 col-xxl-12">
          <div class="service_details">
              <form method="post">
                {% csrf_token %}
                      <div class="form-outline mb-4">
                        <div>
                          <label>Service</label>
                          <input value="{{serv.service}}" class="form-control" name='service' id="exampleFormControlTextarea1" ></textarea>
                      </div>
                      </div>

                      <div class="form-outline mb-4">
                        <div>
                          <label>Service</label>
                          <input value="{{serv.subservice}}" class="form-control" name='subservice' id="exampleFormControlTextarea1" ></textarea>
                      </div>
                      </div>


                <div class="mb-3">
                  <div><img src="/media/{{serv.photo}}" width="150" height="150" alt=""></div> 
                  <label for="photo" class="form-label">Upload Photo to Update</label>
                  <input value="/media/{{serv.photo}}" class="form-control" name='photo' type="file" id="photo" >
                </div> 

                      <label>Description</label>
                      <input value="{{serv.desc}}" type="textarea" class="form-control" name='desc' id="exampleFormControlTextarea1" rows="1"></input>
                  </div>

              <div class="editbtn text-end">
                <br>
                <button type="submit" class="btn btn-success">Update</button>
                  <!-- if user gives wrong data dispaly here -->
     <div class="errormsg">
      {% for message in messages%}
      <h5>{{message}}</h5>
      {% endfor%}
              </div>
            <br><br>
              </form>
          </div>
      </div>
     
  </div>
</div>



</main>
<!--Main layout-->
{% endblock %}
