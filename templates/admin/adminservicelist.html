{% extends 'admin/base.html'%}
{% block content %}
<!--Main layout-->
<main>
</div>
<br>
<div class="text-center my-5">
 <h3 class="display-5">Service List</h3>
 <hr class="w-25 mx-auto"/>
</div>
<div class="container mt-3 table-responsive">
   <table class="table border table-hover">
     <thead>
       <tr>
           <th scope="col">#</th>
           <th scope="col">Name</th>
           <th scope="col">Sub-service</th>
           <th scope="col">Image</th>
           <th scope="col">Description</th>
           <th scope="col">Details</th>
           <th scope="col">Action</th>
       </tr>
     </thead>
     <tbody>
      {%for i in serv%}
       <tr>
           <th scope="row">{{i.service_id}}</th>
           <td>{{i.service}}</td>
           <td>{{i.subservice}}</td>
           <td><img src="'{{i.photo}}'" width="70" height="70" alt=""></td> 
           <td>{{i.desc}}</td>
           
           <td><a href="{%url 'adminservicedetail' pk=i.service_id%}" >View more</a></td>
           <td><a href="deleteservice/{{i.service_id}}" type="submit" >Delete<a></td>
       </tr>
       {%endfor%}

     </tbody>
   </table>
 </div>

<br>


</main>
<!--Main layout-->
{% endblock %}
