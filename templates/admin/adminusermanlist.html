{% extends 'admin/bases.html'%}
{% block content %}
{% load static %}
<!--Main layout-->
 <!-- Middle Section -->
 <main>
</div>
<br>
<div class="text-center my-5">
 <h3 class="display-5">HomeOwners</h3>
 <hr class="w-25 mx-auto"/>
</div>
<div class="container">
  <div class="row justify-content-end">
      <div class="col-md-6">
          <form method="get" action="{% url 'adminusermanlist' %}">
              <div class="input-group mb-3">
                  <input type="text" class="form-control" name="q" placeholder="Search users by username, id, email, or name">
                  <div class="input-group-append">
                      <button class="btn btn-outline-success" type="submit">Search</button>
                      <button class="btn btn-outline-secondary" type="submit">Clear search</button>
                  </div>
              </div>
          </form>
      </div>
  </div>
<div class="container mt-3 table-responsive">
   <table class="table border table-hover">
     <thead>
       <tr>
           <th scope="col">#</th>
           <th scope="col">Name</th>
           <th scope="col">Email</th>
           <th scope="col">Contact</th>
           <th scope="col">Address</th>
           <th scope="col">Details</th>
           <th scope="col">Action</th>
       </tr>
     </thead>
     <tbody>
      {%for i in ho %}
       <tr>
           <th scope="row">{{i.homeowner_id}}</th>
           <td>{{i.full_name}}</td>
           <td>{{i.email}}</td>
           <td>{{i.number}}</td>
           <td>{{i.address}}</td>
           <td><a href="{%url 'adminuserdetail' hk=i.homeowner_id%}">View More<a></td>
            <td><a href="deleteuser/{{i.homeowner_id}}" type="submit">Delete<a></td>
       </tr>
      {% endfor%}
     </tbody>
   </table>
 </div>

<br>


</main>
<!--Main layout-->
{% endblock %}
