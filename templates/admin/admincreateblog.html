{% extends 'admin/bases.html' %}
{% block content %}
{% load static %}

<div class="mb-4">
  <h2 class="mb-1">Create Blog Post</h2>
  <p class="sg-muted mb-0">Publish a new article for your users.</p>
</div>

<div class="card sg-card" style="max-width: 720px;">
  <form action="{% url 'admincreateblog' %}" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="sg-field">
      <label class="form-label" for="title">Title</label>
      <input type="text" class="form-control" name="title" id="title" placeholder="A clear, engaging title" required>
    </div>

    <div class="sg-field">
      <label for="photo" class="form-label">Cover Photo</label>
      <input class="form-control" name="photo" type="file" id="photo">
    </div>

    <div class="sg-field">
      <label class="form-label" for="desc">Description</label>
      <textarea class="form-control" name="desc" id="desc" rows="4" placeholder="Write the article content here."></textarea>
    </div>

    <div class="errormsg">
      {% for message in messages %}
      <h5>{{ message }}</h5>
      {% endfor %}
    </div>

    <div class="mt-3">
      <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-2"></i>Publish Post</button>
    </div>
  </form>
</div>
{% endblock %}
