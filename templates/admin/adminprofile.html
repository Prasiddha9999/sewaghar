{% extends 'admin/bases.html' %}
{% block content %}
{% load static %}

<div class="mb-4">
  <h2 class="mb-1">My Profile</h2>
  <p class="sg-muted mb-0">Your administrator account details.</p>
</div>

<div class="card sg-card" style="max-width: 720px;">
  <div class="row g-4 align-items-start">
    <div class="col-12 col-md-4 text-center">
      <img src="{% static 'images/admin.png' %}" class="sg-photo" alt="Administrator avatar">
      <span class="sg-chip sg-chip-accept mt-3"><i class="bi bi-shield-check me-1"></i>Administrator</span>
    </div>
    <div class="col-12 col-md-8">
      <div class="sg-field">
        <label class="form-label" for="name">Username</label>
        <input type="text" id="name" name="full_name" class="form-control" disabled placeholder="{{ user.username }}">
      </div>
      <div class="sg-field">
        <label class="form-label" for="homeemail">Email</label>
        <input type="email" id="homeemail" name="email" class="form-control" disabled placeholder="{{ user.email }}">
      </div>
      <div class="sg-alert sg-alert-info"><i class="bi bi-info-circle"></i>Admin credentials are managed through the Django administration site.</div>
    </div>
  </div>
</div>
{% endblock %}
