{% extends 'admin/base.html'%}
{% block content %}
<!--Main layout-->
<main>
   <!-- Middle Section -->
   <br><br>
   <div class="text-center my-5">
     <h3 class="display-5">HomeOwner Detail</h3>
     <hr class="w-25 mx-auto">
   </div>
 
   
   <div class="container">
     <div class="row">
       <div class="col-lg-5 col-md-5 col-12 col-xxl-5 d-flex flex-column">
        <h5>Profile Picture</h5>      
           <div class="professionals_image">
               <img src="{{ho.photo}}" class="col-8 rounded float-start" alt="Professioanal Image">
           </div>
       </div>
       <div class="col-lg-7 col-md-7 col-12 col-xxl-7">
           <div class="Professional_details">
            <br>
            <h5>Name:  {{ho.full_name}}</h5>
            <h5>Email:  {{ho.email}}</h5>
            <h5>Mobile Number:  {{ho.number}}</h5>
            <h5>Address:  {{ho.address}}</h5>
            <h5>Password:  {{ho.password}}</h5>
            <br>
            <div class="actionbtn">
              <br>
              <td><a href="../deleteuser/{{ho.homeowner_id}}" class="btn btn-danger" type="submit">Delete<a></td>
              
            </div>
          <br><br>
      </div>
</main>
<!--Main layout-->
{% endblock %}
