{% extends 'admin/bases.html' %}
{% block content %}
{% load static %}

<div class="mb-4">
  <h2 class="mb-1">Create Sub-Service</h2>
  <p class="sg-muted mb-0">Add a bookable sub-service under an existing service category.</p>
</div>

<div class="card sg-card" style="max-width: 720px;">
  <form action="{% url 'admincreatesubservice' %}" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="sg-field">
      <label class="form-label" for="service">Choose Service</label>
      <select class="form-select" id="service" name="service" aria-describedby="service" required>
        <option selected disabled value="">Choose...</option>
        {% for i in servs %}
        <option>{{ i.service_list }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="sg-field">
      <label class="form-label" for="subservice">Sub-Service name</label>
      <input type="text" class="form-control" name="subservice" id="subservice" placeholder="e.g. Wiring" required>
    </div>

    <div class="sg-field">
      <label for="photo" class="form-label">Photo</label>
      <input class="form-control" name="photo" type="file" id="photo">
      <div class="sg-form-hint">Shown to home owners while browsing services.</div>
    </div>

    <div class="sg-field">
      <label class="form-label" for="desc">Description</label>
      <textarea class="form-control" name="desc" id="desc" rows="3" placeholder="Describe what this sub-service covers."></textarea>
    </div>

    <div class="errormsg">
      {% for message in messages %}
      <h5>{{ message }}</h5>
      {% endfor %}
    </div>

    <div class="mt-3">
      <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-2"></i>Create Sub-Service</button>
    </div>
  </form>
</div>
{% endblock %}
