{% extends 'base.html' %}
{% load static %}

{% block nav %}
<nav class="navbar navbar-expand-lg sg-navbar py-2">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">
      <img src="{% static 'images/logo.png' %}" alt="SewaGhar logo">
      <span class="sg-brand-name">Sewa<span>Ghar</span></span>
    </a>
    <div class="d-flex align-items-center gap-2 order-lg-2">
      <button class="sg-theme-toggle" type="button" onclick="sgToggleTheme()" aria-label="Toggle dark mode">
        <i class="bi bi-moon-stars sg-icon-moon"></i>
        <i class="bi bi-sun sg-icon-sun"></i>
      </button>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-label="Toggle navigation">
        <i class="bi bi-list fs-4"></i>
      </button>
    </div>
    <div class="navbar-collapse collapse order-lg-1" id="navbar">
      <ul class="navbar-nav ms-auto me-lg-3 align-items-lg-center gap-lg-1">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'aboutus' %}active{% endif %}" href="{% url 'aboutus' %}">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'blog' %}active{% endif %}" href="{% url 'blog' %}">Blog</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'hsignin' %}active{% endif %}" href="{% url 'hsignin' %}">For Home Owners</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'psignin' %}active{% endif %}" href="{% url 'psignin' %}">For Professionals</a>
        </li>
        <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
          <a class="btn btn-primary btn-sm px-3 py-2" href="{% url 'hsignin' %}"><i class="bi bi-calendar-check me-1"></i>Book a Service</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
{% endblock %}

{% block main %}
{% block content %}
{% endblock %}
{% endblock %}
